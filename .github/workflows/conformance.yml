name: CapabilityPort Conformance

on:
  pull_request:
    paths:
      - 'conformance/**'
      - 'tests/**'
      - 'docs/spec/CAPABILITY_PORT_**'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Python stdlib conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run bounded conformance suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
